<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="600" fill="#f5f5f5" />
  
  <!-- 窗口框架 -->
  <rect x="200" y="100" width="400" height="400" rx="8" ry="8" fill="white" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- 标题栏 -->
  <rect x="200" y="100" width="400" height="50" rx="8" ry="8" fill="#1e3a8a" />
  <text x="225" y="132" font-family="Arial" font-size="18" fill="white">数据库管理工具</text>
  
  <!-- 应用图标 -->
  <rect x="350" y="175" width="100" height="100" rx="50" ry="50" fill="url(#iconGradient)" />
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6af4" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect x="365" y="205" width="70" height="10" rx="5" ry="5" fill="white" fill-opacity="0.7" />
  <rect x="365" y="220" width="70" height="10" rx="5" ry="5" fill="white" fill-opacity="0.5" />
  <rect x="365" y="235" width="70" height="10" rx="5" ry="5" fill="white" fill-opacity="0.3" />
  
  <!-- 登录表单 -->
  <text x="250" y="315" font-family="Arial" font-size="14" fill="#333">用户名</text>
  <rect x="250" y="325" width="300" height="35" rx="4" ry="4" fill="white" stroke="#ccc" />
  <text x="260" y="348" font-family="Arial" font-size="14" fill="#666">admin</text>
  
  <text x="250" y="385" font-family="Arial" font-size="14" fill="#333">密码</text>
  <rect x="250" y="395" width="300" height="35" rx="4" ry="4" fill="white" stroke="#ccc" />
  <text x="260" y="418" font-family="Arial" font-size="14" fill="#666">••••••••</text>
  
  <!-- 登录按钮 -->
  <rect x="315" y="450" width="170" height="40" rx="6" ry="6" fill="#1e3a8a" />
  <text x="380" y="475" font-family="Arial" font-size="16" fill="white">登录</text>
  
  <!-- 记住密码选项 -->
  <rect x="250" y="450" width="16" height="16" rx="3" ry="3" fill="white" stroke="#ccc" />
  <text x="275" y="463" font-family="Arial" font-size="12" fill="#666">记住密码</text>
  
  <!-- 版本信息 -->
  <text x="370" y="510" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">版本 1.0.0</text>
</svg> 