<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="600" fill="#f5f5f5" />
  
  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="800" height="40" fill="#1e3a8a" />
  <text x="20" y="25" font-family="Arial" font-size="16" fill="white">数据库管理工具</text>
  
  <!-- 菜单栏 -->
  <rect x="0" y="40" width="800" height="30" fill="#2e4a9a" />
  <text x="20" y="60" font-family="Arial" font-size="14" fill="white">文件</text>
  <text x="80" y="60" font-family="Arial" font-size="14" fill="white">编辑</text>
  <text x="140" y="60" font-family="Arial" font-size="14" fill="white">视图</text>
  <text x="200" y="60" font-family="Arial" font-size="14" fill="white">工具</text>
  <text x="260" y="60" font-family="Arial" font-size="14" fill="white">帮助</text>
  
  <!-- 左侧连接树 -->
  <rect x="0" y="70" width="250" height="530" fill="white" />
  <rect x="0" y="70" width="250" height="30" fill="#e0e0e0" />
  <text x="10" y="90" font-family="Arial" font-size="14" fill="#333">连接</text>
  
  <!-- 连接项 -->
  <rect x="10" y="110" width="230" height="25" rx="3" ry="3" fill="#f0f7ff" stroke="#c0d0e0" />
  <text x="35" y="127" font-family="Arial" font-size="13" fill="#333">MySQL 生产环境</text>
  <circle cx="25" cy="122" r="8" fill="#4a6af4" />
  
  <!-- 连接展开的数据库 -->
  <text x="35" y="157" font-family="Arial" font-size="13" fill="#333">├─ 用户数据库</text>
  <text x="35" y="177" font-family="Arial" font-size="13" fill="#333">├─ 产品数据库</text>
  <text x="35" y="197" font-family="Arial" font-size="13" fill="#333">└─ 日志数据库</text>
  
  <!-- 另一个连接项 -->
  <rect x="10" y="220" width="230" height="25" rx="3" ry="3" fill="#f0f0f0" stroke="#d0d0d0" />
  <text x="35" y="237" font-family="Arial" font-size="13" fill="#333">PostgreSQL 开发环境</text>
  <circle cx="25" cy="232" r="8" fill="#30b777" />
  
  <!-- 右侧内容区 -->
  <rect x="250" y="70" width="550" height="530" fill="#fafafa" />
  
  <!-- 选项卡 -->
  <rect x="250" y="70" width="550" height="30" fill="#e0e0e0" />
  <rect x="250" y="70" width="120" height="30" fill="#fff" stroke="#ccc" />
  <text x="275" y="90" font-family="Arial" font-size="13" fill="#333">表数据</text>
  <rect x="370" y="70" width="120" height="30" fill="#e0e0e0" stroke="#ccc" />
  <text x="395" y="90" font-family="Arial" font-size="13" fill="#333">SQL查询</text>
  
  <!-- 表格 -->
  <rect x="260" y="110" width="530" height="35" fill="#f0f0f0" />
  <line x1="260" y1="110" x2="790" y2="110" stroke="#ccc" />
  <line x1="260" y1="145" x2="790" y2="145" stroke="#ccc" />
  <line x1="260" y1="180" x2="790" y2="180" stroke="#ccc" />
  <line x1="260" y1="215" x2="790" y2="215" stroke="#ccc" />
  <line x1="260" y1="250" x2="790" y2="250" stroke="#ccc" />
  <line x1="260" y1="285" x2="790" y2="285" stroke="#ccc" />
  
  <line x1="320" y1="110" x2="320" y2="285" stroke="#ccc" />
  <line x1="430" y1="110" x2="430" y2="285" stroke="#ccc" />
  <line x1="540" y1="110" x2="540" y2="285" stroke="#ccc" />
  <line x1="650" y1="110" x2="650" y2="285" stroke="#ccc" />
  
  <!-- 表头 -->
  <text x="270" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#333">ID</text>
  <text x="330" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#333">用户名</text>
  <text x="440" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#333">邮箱</text>
  <text x="550" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#333">创建日期</text>
  <text x="660" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#333">状态</text>
  
  <!-- 行数据 -->
  <text x="270" y="165" font-family="Arial" font-size="12" fill="#333">1</text>
  <text x="330" y="165" font-family="Arial" font-size="12" fill="#333">admin</text>
  <text x="440" y="165" font-family="Arial" font-size="12" fill="#333">admin@example.com</text>
  <text x="550" y="165" font-family="Arial" font-size="12" fill="#333">2023-01-15</text>
  <text x="660" y="165" font-family="Arial" font-size="12" fill="#333">活跃</text>
  
  <text x="270" y="200" font-family="Arial" font-size="12" fill="#333">2</text>
  <text x="330" y="200" font-family="Arial" font-size="12" fill="#333">user1</text>
  <text x="440" y="200" font-family="Arial" font-size="12" fill="#333">user1@example.com</text>
  <text x="550" y="200" font-family="Arial" font-size="12" fill="#333">2023-02-20</text>
  <text x="660" y="200" font-family="Arial" font-size="12" fill="#333">活跃</text>
  
  <text x="270" y="235" font-family="Arial" font-size="12" fill="#333">3</text>
  <text x="330" y="235" font-family="Arial" font-size="12" fill="#333">user2</text>
  <text x="440" y="235" font-family="Arial" font-size="12" fill="#333">user2@example.com</text>
  <text x="550" y="235" font-family="Arial" font-size="12" fill="#333">2023-03-05</text>
  <text x="660" y="235" font-family="Arial" font-size="12" fill="#333">禁用</text>
  
  <text x="270" y="270" font-family="Arial" font-size="12" fill="#333">4</text>
  <text x="330" y="270" font-family="Arial" font-size="12" fill="#333">user3</text>
  <text x="440" y="270" font-family="Arial" font-size="12" fill="#333">user3@example.com</text>
  <text x="550" y="270" font-family="Arial" font-size="12" fill="#333">2023-03-25</text>
  <text x="660" y="270" font-family="Arial" font-size="12" fill="#333">活跃</text>
  
  <!-- 分页控件 -->
  <rect x="400" y="300" width="250" height="30" fill="none" />
  <text x="420" y="320" font-family="Arial" font-size="12" fill="#333">← 上一页</text>
  <rect x="485" y="305" width="25" height="20" fill="#1e3a8a" rx="3" ry="3" />
  <text x="495" y="320" font-family="Arial" font-size="12" fill="white">1</text>
  <text x="520" y="320" font-family="Arial" font-size="12" fill="#333">2</text>
  <text x="545" y="320" font-family="Arial" font-size="12" fill="#333">3</text>
  <text x="570" y="320" font-family="Arial" font-size="12" fill="#333">下一页 →</text>
  
  <!-- 状态栏 -->
  <rect x="0" y="570" width="800" height="30" fill="#e0e0e0" />
  <text x="20" y="590" font-family="Arial" font-size="12" fill="#333">已连接 - MySQL 生产环境 | 共4条记录 | 查询用时: 15ms</text>
</svg> 